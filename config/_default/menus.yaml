# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the
#   `id` of the desired section in `content/_index.md`.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /
    weight: 10
  - name: Projects
    url: /project/
    weight: 20
  - name: Publications
    url: '/#publications'
    weight: 30
  - name: Teaching
    url: '/#teaching'
    weight: 40
  - name: Outreach
    url: /outreach/
    weight: 50
  - name: Contact
    url: '/#contact'
    weight: 60
